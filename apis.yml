name: PraxiPal
description: >-
  PraxiPal GmbH (Berlin, Germany) builds Luna, an AI voice receptionist for
  medical, dental, therapeutic, and veterinary practices. Luna answers incoming
  phone calls 24/7, handles patient questions, books and reschedules
  appointments, and processes prescription requests autonomously, integrating
  directly with 40+ German practice-management systems (PVS) such as CGM
  MEDISTAR, tomedo, charly by solutio, DAMPSOFT, and DENSoffice. It operates in
  a GDPR-compliant manner on European servers with medical-confidentiality
  safeguards under German law. PraxiPal is backed by HV Capital. No public API,
  developer portal, or SDK is currently published; this profile tracks the
  company as an API Evangelist network lead.
